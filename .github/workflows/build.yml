name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Ensure debug keystore
        run: |
          if [ ! -f app/debug.keystore ]; then
            keytool -genkeypair -v -keystore app/debug.keystore \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
      - name: Stage web UI into assets
        run: |
          mkdir -p app/src/main/assets
          cat app.part0.js app.part1.js app.part2.js > app.js
          cp -f index.html app.js manifest.json sw.js app/src/main/assets/ 2>/dev/null || true
          ls -la app/src/main/assets/
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk endpoint-tester.apk
      - uses: actions/upload-artifact@v4
        with:
          name: endpoint-tester-apk
          path: endpoint-tester.apk
      - name: Replace old release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete latest-build --cleanup-tag -y || true
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: Endpoint Tester - latest build
          target_commitish: ${{ github.sha }}
          files: endpoint-tester.apk
          make_latest: true
          body: |
            v1.3 — multi-provider profiles, liquid glass UI, SVG icons.
