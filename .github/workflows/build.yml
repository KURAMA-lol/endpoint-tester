name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Decode stable signing keystore
        run: |
          base64 -d app/debug.p12.b64 > app/debug.p12
          ls -la app/debug.p12
      - name: Stage web UI into assets
        run: |
          mkdir -p app/src/main/assets
          cat app.part0.js app.part1.js app.part2.js > app.js
          cp -f index.html app.js app/src/main/assets/
          ls -la app/src/main/assets/
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk endpoint-tester.apk
      - uses: actions/upload-artifact@v4
        with:
          name: endpoint-tester-apk
          path: endpoint-tester.apk
      - name: Replace old release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-build --yes || true
          gh release create latest-build endpoint-tester.apk             --title "Latest build"             --notes "Install over previous build (same signing key). Export providers in Settings before any wipe."
