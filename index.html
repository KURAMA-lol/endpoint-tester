<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#0b0b10"/><title>Endpoint Tester</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
:root,[data-theme=dark]{--bg:#07070b;--glass:rgba(255,255,255,.05);--glass2:rgba(255,255,255,.08);--bd:rgba(255,255,255,.1);--tx:#f4f4f8;--tx2:#a8a8bc;--mu:#6e6e84;--ac:#8b7cff;--ac2:#6366f1;--glow:rgba(139,124,255,.28);--user:rgba(139,124,255,.18);--asst:rgba(255,255,255,.04);--ok:#34d399;--err:#f87171;--r:16px;--bl:24px}
[data-theme=light]{--bg:#eef0f6;--glass:rgba(255,255,255,.55);--glass2:rgba(255,255,255,.75);--bd:rgba(0,0,0,.08);--tx:#12121a;--tx2:#4a4a5e;--mu:#8a8a9e;--ac:#6d5cff;--ac2:#4f46e5;--glow:rgba(109,92,255,.2);--user:rgba(109,92,255,.12);--asst:rgba(255,255,255,.65)}
*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--tx);overflow:hidden}
body{background:radial-gradient(ellipse 80% 60% at 0% 0%,color-mix(in srgb,var(--ac) 22%,transparent),transparent 55%),radial-gradient(ellipse 50% 40% at 100% 100%,color-mix(in srgb,var(--ac2) 12%,transparent),transparent 50%),var(--bg)}
.app{display:grid;grid-template-columns:290px 1fr;height:100%;max-width:1200px;margin:0 auto}
.sidebar{display:flex;flex-direction:column;gap:8px;padding:12px;border-right:1px solid var(--bd);background:var(--glass);backdrop-filter:blur(var(--bl));overflow:hidden;z-index:10}
.brand{display:flex;align-items:center;justify-content:space-between;padding:2px 4px 6px}
.brand-l{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px}
.logo{width:28px;height:28px;border-radius:9px;background:linear-gradient(135deg,var(--ac),var(--ac2));display:grid;place-items:center;box-shadow:0 4px 12px var(--glow)}
.logo svg,.ib svg,.btn svg,.send svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.logo svg{stroke:#fff;width:15px;height:15px}
.ib{width:32px;height:32px;border-radius:9px;border:1px solid var(--bd);background:var(--glass2);color:var(--tx2);cursor:pointer;display:grid;place-items:center}
.ib.sm{width:26px;height:26px;border-radius:7px}.ib.sm svg{width:13px;height:13px}
.ph{display:flex;align-items:center;justify-content:space-between;padding:0 2px}
.ph span{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--mu)}
.pl{display:flex;flex-direction:column;gap:4px;overflow-y:auto;max-height:140px}
.pi{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:11px;border:1px solid transparent;background:transparent;cursor:pointer;text-align:left;color:var(--tx);font:500 12px Inter,sans-serif;width:100%}
.pi:hover{background:var(--glass2);border-color:var(--bd)}.pi.on{background:color-mix(in srgb,var(--ac) 14%,transparent);border-color:color-mix(in srgb,var(--ac) 35%,transparent)}
.pi .ic{width:26px;height:26px;border-radius:7px;background:var(--glass2);border:1px solid var(--bd);display:grid;place-items:center;flex-shrink:0}
.pi .ic svg{stroke:var(--ac);width:13px;height:13px}.pi .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pi .sb{font-size:10px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scroll{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;min-height:0}
.card{background:var(--glass2);border:1px solid var(--bd);border-radius:var(--r);padding:11px;backdrop-filter:blur(12px)}
.ct{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--mu);margin-bottom:8px}
.f{margin-bottom:8px}label{display:block;font-size:11px;color:var(--tx2);margin-bottom:3px;font-weight:500}
input,select,textarea{width:100%;background:color-mix(in srgb,var(--bg) 55%,transparent);border:1px solid var(--bd);border-radius:9px;padding:8px 10px;color:var(--tx);font:13px Inter,sans-serif;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--ac);box-shadow:0 0 0 3px var(--glow)}
select{cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:7px 11px;border-radius:9px;border:1px solid var(--bd);background:var(--glass2);color:var(--tx);font:500 12px Inter,sans-serif;cursor:pointer}
.btn:hover{border-color:color-mix(in srgb,var(--ac) 40%,var(--bd))}.btn-b{width:100%}.btn-g{background:transparent}
.btn-p{background:linear-gradient(135deg,var(--ac),var(--ac2));border:none;color:#fff;box-shadow:0 4px 14px var(--glow)}
.row2{display:flex;gap:5px}.row2>*{flex:1}.mr{display:flex;gap:5px}.mr input{flex:1}.mr .btn{flex:0}
.st{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--mu);margin-top:7px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--mu)}.dot.ok{background:var(--ok)}.dot.err{background:var(--err)}.dot.loading{background:var(--ac);animation:p 1s infinite}@keyframes p{50%{opacity:.35}}
.main{display:flex;flex-direction:column;height:100%;min-width:0}
.hd{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--bd);background:var(--glass);backdrop-filter:blur(var(--bl))}
.hd h1{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hd .sub{font-size:11px;color:var(--mu)}
.msgs{flex:1;overflow-y:auto;padding:16px 14px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:78%;padding:10px 13px;border-radius:14px;font-size:13px;line-height:1.5;white-space:pre-wrap;word-break:break-word;border:1px solid var(--bd);backdrop-filter:blur(10px)}
.msg.user{align-self:flex-end;background:var(--user);border-color:color-mix(in srgb,var(--ac) 30%,transparent);border-bottom-right-radius:4px}
.msg.assistant{align-self:flex-start;background:var(--asst);border-bottom-left-radius:4px}
.msg.system{align-self:center;color:var(--mu);font-size:11px;border:none;background:transparent}
.msg.error{align-self:center;background:color-mix(in srgb,var(--err) 12%,transparent);border-color:color-mix(in srgb,var(--err) 30%,transparent);color:var(--err);font-size:12px;max-width:92%}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--mu);text-align:center;padding:28px}
.composer{padding:11px 14px 14px;border-top:1px solid var(--bd);background:var(--glass);backdrop-filter:blur(var(--bl))}
.row{display:flex;gap:8px;align-items:flex-end}
#userInput{resize:none;min-height:42px;max-height:110px;padding:10px 12px;border-radius:12px;flex:1;background:var(--glass2)}
.send{width:42px;height:42px;border-radius:12px;border:none;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;cursor:pointer;display:grid;place-items:center;box-shadow:0 4px 12px var(--glow)}
.send svg{stroke:#fff;width:17px;height:17px}.send:disabled{opacity:.35;cursor:not-allowed;box-shadow:none}
.hint{font-size:10px;color:var(--mu);text-align:center;margin-top:5px}
.mobile{display:none}.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;backdrop-filter:blur(3px)}.ov.show{display:block}
@media(max-width:800px){.app{grid-template-columns:1fr}.sidebar{position:fixed;inset:0 auto 0 0;width:min(300px,90vw);transform:translateX(-100%);transition:transform .25s;z-index:50}.sidebar.open{transform:none}.mobile{display:grid}.msg{max-width:90%}}
</style></head>
<body>
<div class="ov" id="overlay"></div>
<div class="app">
<aside class="sidebar" id="sidebar">
  <div class="brand"><div class="brand-l"><div class="logo"><svg viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg></div>Endpoint Tester</div>
  <button class="ib" id="themeBtn" type="button"><svg viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></button></div>
  <div class="ph"><span>Providers</span><button class="ib sm" id="addProfile" type="button"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button></div>
  <div class="pl" id="profileList"></div>
  <div class="scroll">
    <div class="card"><div class="ct">Active</div>
      <div class="f"><label>Name</label><input id="profName" placeholder="My API"/></div>
      <div class="f"><label>Type</label><select id="provider"><option value="openai">OpenAI Compatible</option><option value="gemini">Google Gemini</option><option value="keyless">Keyless / Custom</option></select></div>
      <div class="f"><label>Base URL</label><input id="baseUrl" type="url" placeholder="https://api.openai.com/v1"/></div>
      <div class="f" id="keyField"><label>API Key</label><input id="apiKey" type="password" placeholder="sk-..." autocomplete="off"/></div>
      <div class="f"><label>Model</label><div class="mr"><input id="model" list="modelList" placeholder="gpt-4o-mini"/><datalist id="modelList"></datalist>
        <button class="btn" id="fetchModels" type="button" title="Fetch models"><svg viewBox="0 0 24 24"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg></button></div></div>
    </div>
    <div class="card"><div class="ct">Generation</div>
      <div class="f"><label>Temperature</label><input id="temperature" type="number" min="0" max="2" step="0.1" value="0.7"/></div>
      <div class="f"><label>Max Tokens</label><input id="maxTokens" type="number" value="1024"/></div>
      <div class="f"><label style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="stream" checked style="width:auto"/> Stream</label></div>
      <div class="f"><label>System</label><textarea id="systemPrompt" rows="2" placeholder="You are a helpful assistant."></textarea></div>
    </div>
  </div>
  <div class="card">
    <div class="row2"><button class="btn btn-g" id="clearChat" type="button">Clear</button><button class="btn btn-g" id="saveSettings" type="button">Save</button></div>
    <button class="btn btn-p btn-b" id="testConn" style="margin-top:6px" type="button">Test connection</button>
    <div class="st"><span class="dot" id="statusDot"></span><span id="statusText">Ready</span></div>
  </div>
</aside>
<main class="main">
  <div class="hd"><button class="ib mobile" id="menuBtn" type="button"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    <div style="flex:1;min-width:0"><h1 id="headerModel">Select a provider</h1><div class="sub" id="headerSub">Configure in the sidebar</div></div>
  </div>
  <div class="msgs" id="messages"><div class="empty" id="emptyState"><p>Add a provider, pick a model, start chatting.</p></div></div>
  <div class="composer"><div class="row"><textarea id="userInput" rows="1" placeholder="Message..." disabled></textarea>
    <button class="send" id="sendBtn" disabled type="button"><svg viewBox="0 0 24 24"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg></button></div>
    <div class="hint">Enter to send · Shift+Enter newline</div></div>
</main>
</div>
<script src="app.js"></script>
</body></html>
