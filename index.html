<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#0a0a0f"/>
<title>Endpoint Tester</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root,[data-theme=dark]{--bg:#0a0a0f;--bg-elev:#12121a;--glass:rgba(255,255,255,.04);--glass-h:rgba(255,255,255,.07);--stroke:rgba(255,255,255,.08);--stroke-h:rgba(255,255,255,.14);--text:#ececf1;--text-2:#a1a1b5;--muted:#6b6b80;--accent:#8b7cff;--accent-2:#6d5cff;--glow:rgba(139,124,255,.25);--user:rgba(139,124,255,.16);--bot:rgba(255,255,255,.04);--err:#f87171;--danger:#ef4444;--r:14px;--blur:40px}
[data-theme=light]{--bg:#f5f5f8;--bg-elev:#fff;--glass:rgba(255,255,255,.65);--glass-h:rgba(255,255,255,.9);--stroke:rgba(0,0,0,.08);--stroke-h:rgba(0,0,0,.12);--text:#111118;--text-2:#4a4a5c;--muted:#8a8a9c;--accent:#6d5cff;--accent-2:#5b4ce0;--glow:rgba(109,92,255,.2);--user:rgba(109,92,255,.12);--bot:rgba(0,0,0,.03)}
*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
body{background:radial-gradient(ellipse 70% 50% at 15% -10%,color-mix(in srgb,var(--accent) 18%,transparent),transparent 55%),var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;border:none;background:none}
svg{stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.app{display:grid;grid-template-columns:260px 1fr;height:100%;max-width:1400px;margin:0 auto}
.side{display:flex;flex-direction:column;gap:8px;padding:12px 10px;background:var(--glass);backdrop-filter:blur(var(--blur));border-right:1px solid var(--stroke);z-index:20;overflow:hidden}
.side-top{display:flex;gap:6px;align-items:center}
.btn-new{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:10px 12px;border-radius:12px;font-size:13px;font-weight:600;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;box-shadow:0 4px 16px var(--glow)}
.btn-new svg{width:16px;height:16px;stroke:#fff}
.icon-btn{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;border:1px solid var(--stroke);background:var(--glass-h);color:var(--text-2)}
.icon-btn:hover{border-color:var(--stroke-h);color:var(--text)}.icon-btn svg{width:16px;height:16px}
.sec-label{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:10px 8px 4px;display:flex;align-items:center;justify-content:space-between}
.sec-label button{color:var(--muted);padding:2px}.sec-label button:hover{color:var(--accent)}.sec-label button svg{width:14px;height:14px}
.list{display:flex;flex-direction:column;gap:2px;overflow-y:auto;flex:1;min-height:0;padding:0 2px}
.item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;text-align:left;width:100%;color:var(--text-2);font-size:13px;border:1px solid transparent}
.item:hover{background:var(--glass-h);color:var(--text)}
.item.active{background:color-mix(in srgb,var(--accent) 12%,transparent);border-color:color-mix(in srgb,var(--accent) 28%,transparent);color:var(--text)}
.item .dot-p{width:8px;height:8px;border-radius:50%;background:var(--accent);flex-shrink:0;opacity:.7}.item.active .dot-p{opacity:1;box-shadow:0 0 8px var(--glow)}
.item .meta{flex:1;min-width:0}.item .name{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.item .sub{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .act{opacity:0;display:flex;gap:4px;font-size:11px}.item:hover .act,.item.active .act{opacity:1}
.item .act button{padding:2px 6px;border-radius:6px;color:var(--muted);border:1px solid var(--stroke)}.item .act button:hover{color:var(--text)}.item .act button.danger:hover{color:var(--danger)}
.side-foot{padding-top:6px;border-top:1px solid var(--stroke)}
.main{display:flex;flex-direction:column;min-width:0;height:100%}
.topbar{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--stroke);background:var(--glass);backdrop-filter:blur(var(--blur))}
.topbar .menu-m{display:none}
.pickers{display:flex;gap:8px;flex:1;min-width:0;flex-wrap:wrap}
.picker{display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;border:1px solid var(--stroke);background:var(--glass-h);font-size:12px;font-weight:500;color:var(--text)}
.picker select{appearance:none;border:none;background:transparent;outline:none;cursor:pointer;font-size:12px;font-weight:500;max-width:160px;color:var(--text)}
.picker label{font-size:11px;color:var(--muted);font-weight:500}
.msgs{flex:1;overflow-y:auto;padding:24px 16px}
.msgs-inner{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.msg{display:flex;gap:12px;align-items:flex-start}
.msg .av{width:28px;height:28px;border-radius:8px;flex-shrink:0;display:grid;place-items:center;font-size:11px;font-weight:700}
.msg.user .av{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff}
.msg.bot .av{background:var(--glass-h);border:1px solid var(--stroke);color:var(--accent)}
.msg .bubble{flex:1;min-width:0;padding:10px 14px;border-radius:14px;font-size:14px;line-height:1.55;white-space:pre-wrap;word-break:break-word;border:1px solid var(--stroke)}
.msg.user .bubble{background:var(--user);border-color:color-mix(in srgb,var(--accent) 25%,transparent)}
.msg.bot .bubble{background:var(--bot)}
.msg.sys{justify-content:center}.msg.sys .bubble{background:transparent;border:none;color:var(--muted);font-size:12px;text-align:center}
.msg.err .bubble{background:color-mix(in srgb,var(--err) 10%,transparent);border-color:color-mix(in srgb,var(--err) 28%,transparent);color:var(--err);font-size:13px}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--muted);text-align:center;padding:40px 20px;min-height:40vh}
.empty .hero{width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,var(--accent),var(--accent-2));box-shadow:0 8px 28px var(--glow)}
.empty h2{font-size:18px;font-weight:600;color:var(--text)}.empty p{font-size:13px;max-width:320px;line-height:1.5}
.composer-wrap{padding:12px 16px 18px;border-top:1px solid var(--stroke);background:var(--glass);backdrop-filter:blur(var(--blur))}
.composer{max-width:720px;margin:0 auto;display:flex;gap:8px;align-items:flex-end;padding:8px 8px 8px 14px;border-radius:18px;border:1px solid var(--stroke);background:var(--glass-h);box-shadow:0 4px 24px rgba(0,0,0,.15)}
.composer:focus-within{border-color:color-mix(in srgb,var(--accent) 45%,var(--stroke));box-shadow:0 0 0 3px var(--glow)}
.composer textarea{flex:1;border:none;outline:none;background:transparent;resize:none;min-height:24px;max-height:140px;padding:8px 0;font-size:14px;line-height:1.45}
.composer .send{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;flex-shrink:0;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff}
.composer .send:disabled{opacity:.35}.composer .send svg{width:16px;height:16px;stroke:#fff}
.hint{text-align:center;font-size:11px;color:var(--muted);margin-top:8px}
.modal-bg{display:none;position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.5);backdrop-filter:blur(6px);align-items:center;justify-content:center;padding:16px}
.modal-bg.show{display:flex}
.modal{width:100%;max-width:420px;max-height:90vh;overflow-y:auto;background:var(--bg-elev);border:1px solid var(--stroke-h);border-radius:20px;box-shadow:0 24px 64px rgba(0,0,0,.45);padding:20px}
.modal h3{font-size:16px;font-weight:600;margin-bottom:14px}
.field{margin-bottom:12px}.field label{display:block;font-size:12px;font-weight:500;color:var(--text-2);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--stroke);background:var(--glass);outline:none;font-size:13px}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--glow)}
.modal-actions{display:flex;gap:8px;margin-top:16px}
.modal-actions .btn{flex:1;padding:10px;border-radius:11px;font-size:13px;font-weight:600;border:1px solid var(--stroke);background:var(--glass-h)}
.modal-actions .btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));border:none;color:#fff}
.modal-actions .btn.ghost{background:transparent}
.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:15}.ov.show{display:block}
@media(max-width:800px){.app{grid-template-columns:1fr}.side{position:fixed;inset:0 auto 0 0;width:min(280px,88vw);transform:translateX(-100%);transition:transform .22s;z-index:30}.side.open{transform:none}.topbar .menu-m{display:grid}}
</style>
</head>
<body>
<div class="ov" id="overlay"></div>
<div class="app">
<aside class="side" id="sidebar">
  <div class="side-top">
    <button class="btn-new" id="btnNewChat" type="button"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg> New chat</button>
    <button class="icon-btn" id="themeBtn" type="button" title="Theme"><svg viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></button>
  </div>
  <div class="sec-label"><span>Chats</span></div>
  <div class="list" id="chatList"></div>
  <div class="sec-label"><span>Providers</span>
    <button type="button" id="btnAddProvider" title="Add"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  </div>
  <div class="list" id="providerList"></div>
  <div class="side-foot">
    <button class="icon-btn" id="btnManage" type="button" title="Edit active provider" style="width:100%">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
    </button>
  </div>
</aside>
<main class="main">
  <div class="topbar">
    <button class="icon-btn menu-m" id="menuBtn" type="button"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    <div class="pickers">
      <div class="picker"><label>Provider</label><select id="selProvider"></select></div>
      <div class="picker"><label>Model</label><select id="selModel"></select></div>
    </div>
  </div>
  <div class="msgs" id="messages"><div class="msgs-inner" id="msgsInner">
    <div class="empty"><div class="hero"></div><h2>Start a conversation</h2><p>Pick a provider and model, then send a message.</p></div>
  </div></div>
  <div class="composer-wrap">
    <div class="composer">
      <textarea id="userInput" rows="1" placeholder="Message..." disabled></textarea>
      <button class="send" id="sendBtn" disabled type="button"><svg viewBox="0 0 24 24"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg></button>
    </div>
    <div class="hint">Enter to send</div>
  </div>
</main>
</div>
<div class="modal-bg" id="providerModal">
  <div class="modal">
    <h3 id="modalTitle">Edit provider</h3>
    <div class="field"><label>Name</label><input id="fName" placeholder="My OpenAI"/></div>
    <div class="field"><label>Type</label><select id="fType"><option value="openai">OpenAI Compatible</option><option value="gemini">Google Gemini</option><option value="keyless">Keyless / Custom</option></select></div>
    <div class="field"><label>Base URL</label><input id="fUrl" type="url" placeholder="https://api.openai.com/v1"/></div>
    <div class="field" id="fKeyWrap"><label>API Key</label><input id="fKey" type="password" placeholder="sk-..." autocomplete="off"/></div>
    <div class="field"><label>Default model</label><input id="fModel" placeholder="gpt-4o-mini"/></div>
    <div class="field"><label>Temperature</label><input id="fTemp" type="number" min="0" max="2" step="0.1" value="0.7"/></div>
    <div class="field"><label>Max tokens</label><input id="fMax" type="number" value="1024"/></div>
    <div class="field"><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="fStream" checked style="width:auto"/> Stream</label></div>
    <div class="field"><label>System prompt</label><textarea id="fSys" rows="2" placeholder="Optional"></textarea></div>
    <div class="modal-actions">
      <button class="btn ghost" type="button" id="modalCancel">Cancel</button>
      <button class="btn" type="button" id="modalFetch">Fetch models</button>
      <button class="btn primary" type="button" id="modalSave">Save</button>
    </div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
