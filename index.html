<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#0b0b10"/>
<link rel="manifest" href="manifest.json"/>
<title>Endpoint Tester</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
:root,[data-theme=dark]{--bg:#0b0b10;--surface:rgba(255,255,255,.04);--border:rgba(255,255,255,.09);--text:#f2f2f7;--text2:#a1a1b5;--muted:#6b6b80;--accent:#8b7cff;--accent-soft:rgba(139,124,255,.18);--user:rgba(139,124,255,.2);--asst:rgba(255,255,255,.05);--ok:#34d399;--err:#f87171;--radius:16px;--blur:20px}
[data-theme=light]{--bg:#f4f4f8;--surface:rgba(0,0,0,.03);--border:rgba(0,0,0,.08);--text:#1a1a24;--text2:#4a4a5c;--muted:#8a8a9c;--accent:#6d5cff;--accent-soft:rgba(109,92,255,.12);--user:rgba(109,92,255,.12);--asst:rgba(0,0,0,.03)}
*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
body{background:radial-gradient(ellipse 90% 70% at 10% -10%,color-mix(in srgb,var(--accent) 18%,transparent),transparent 55%),var(--bg)}
.app{display:grid;grid-template-columns:320px 1fr;height:100%;max-width:1400px;margin:0 auto}
.sidebar{display:flex;flex-direction:column;gap:12px;padding:16px 12px;border-right:1px solid var(--border);background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(var(--blur));overflow-y:auto;z-index:10}
.brand{display:flex;align-items:center;justify-content:space-between;padding:2px 4px}
.brand-left{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px}
.icon{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--accent),#38bdf8);display:grid;place-items:center}
.theme-btn{width:32px;height:32px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text2);cursor:pointer;font-size:14px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px}
.card-title{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:10px}
.field{margin-bottom:10px}label{display:block;font-size:11px;color:var(--text2);margin-bottom:4px}
input,select,textarea{width:100%;background:color-mix(in srgb,var(--bg) 80%,transparent);border:1px solid var(--border);border-radius:8px;padding:8px 10px;color:var(--text);font-size:13px;font-family:inherit;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
select{cursor:pointer}.btn{display:inline-flex;align-items:center;justify-content:center;padding:8px 12px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:12px;font-weight:500;cursor:pointer;font-family:inherit}
.btn:hover{background:rgba(255,255,255,.08)}.btn-block{width:100%}.btn-ghost{background:transparent}.btn-row{display:flex;gap:6px}.btn-row>*{flex:1}.btn:disabled{opacity:.4;cursor:not-allowed}
.status{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);margin-top:8px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--muted)}.dot.ok{background:var(--ok)}.dot.err{background:var(--err)}.dot.loading{background:var(--accent);animation:p 1s infinite}@keyframes p{50%{opacity:.35}}
.main{display:flex;flex-direction:column;height:100%;min-width:0}
.header{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid var(--border);gap:10px}
.header h1{font-size:12px;font-weight:500;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.messages{flex:1;overflow-y:auto;padding:20px 16px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:78%;padding:10px 14px;border-radius:16px;font-size:13px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.msg.user{align-self:flex-end;background:var(--user);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);border-bottom-right-radius:4px}
.msg.assistant{align-self:flex-start;background:var(--asst);border:1px solid var(--border);border-bottom-left-radius:4px}
.msg.system{align-self:center;color:var(--muted);font-size:11px;text-align:center}
.msg.error{align-self:center;background:color-mix(in srgb,var(--err) 12%,transparent);border:1px solid color-mix(in srgb,var(--err) 30%,transparent);color:var(--err);font-size:12px;max-width:92%}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--muted);text-align:center;padding:32px}
.composer{padding:12px 16px 16px;border-top:1px solid var(--border)}
.row{display:flex;gap:8px;align-items:flex-end}
#userInput{resize:none;min-height:44px;max-height:120px;padding:10px 12px;border-radius:12px;flex:1}
.send{width:44px;height:44px;border-radius:12px;border:none;background:linear-gradient(135deg,var(--accent),#6366f1);color:#fff;font-size:16px;cursor:pointer}.send:disabled{opacity:.35;cursor:not-allowed}
.hint{font-size:10px;color:var(--muted);text-align:center;margin-top:6px}
.mobile{display:none;width:34px;height:34px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:16px;cursor:pointer;place-items:center}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40}.overlay.show{display:block}
.model-row{display:flex;gap:6px}.model-row input{flex:1}.model-row .btn{flex:0 0 auto;padding:8px 10px}
@media(max-width:800px){.app{grid-template-columns:1fr}.sidebar{position:fixed;inset:0 auto 0 0;width:min(300px,88vw);transform:translateX(-100%);transition:transform .25s;z-index:50}.sidebar.open{transform:none}.mobile{display:grid}.msg{max-width:90%}}
</style>
</head>
<body>
<div class="overlay" id="overlay"></div>
<div class="app">
<aside class="sidebar" id="sidebar">
  <div class="brand"><div class="brand-left"><div class="icon">&#9889;</div>Endpoint Tester</div>
  <button class="theme-btn" id="themeBtn">&#127769;</button></div>
  <div class="card"><div class="card-title">Provider</div>
    <div class="field"><label>Type</label>
      <select id="provider"><option value="openai">OpenAI Compatible</option><option value="gemini">Google Gemini</option><option value="keyless">Keyless / Custom</option></select></div>
    <div class="field"><label>Base URL</label><input id="baseUrl" type="url" placeholder="https://api.openai.com/v1"/></div>
    <div class="field" id="keyField"><label>API Key</label><input id="apiKey" type="password" placeholder="sk-\u2026"/></div>
    <div class="field"><label>Model</label>
      <div class="model-row"><input id="model" list="modelList" placeholder="gpt-4o-mini"/><datalist id="modelList"></datalist>
      <button class="btn" id="fetchModels" title="Fetch models">&#8635;</button></div></div>
  </div>
  <div class="card"><div class="card-title">Generation</div>
    <div class="field"><label>Temperature</label><input id="temperature" type="number" min="0" max="2" step="0.1" value="0.7"/></div>
    <div class="field"><label>Max Tokens</label><input id="maxTokens" type="number" value="1024"/></div>
    <div class="field"><label style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="stream" checked style="width:auto"/> Stream</label></div>
    <div class="field"><label>System prompt</label><textarea id="systemPrompt" rows="2" placeholder="You are a helpful assistant."></textarea></div>
  </div>
  <div class="card" style="margin-top:auto">
    <div class="btn-row"><button class="btn btn-ghost" id="clearChat">Clear</button><button class="btn btn-ghost" id="saveSettings">Save</button></div>
    <button class="btn btn-block" id="testConn" style="margin-top:6px">Test connection</button>
    <div class="status"><span class="dot" id="statusDot"></span><span id="statusText">Ready</span></div>
  </div>
</aside>
<main class="main">
  <div class="header"><button class="mobile" id="menuBtn">&#9776;</button><h1 id="headerModel">Configure an endpoint</h1><div style="width:34px"></div></div>
  <div class="messages" id="messages"><div class="empty" id="emptyState"><div style="font-size:36px;opacity:.4">&#128172;</div><p>Pick a provider and start chatting.</p></div></div>
  <div class="composer"><div class="row"><textarea id="userInput" rows="1" placeholder="Type a message\u2026" disabled></textarea><button class="send" id="sendBtn" disabled>&#10148;</button></div>
  <div class="hint">Enter to send \u00B7 Shift+Enter newline</div></div>
</main>
</div>
<script src="app.js"></script>
</body>
</html>
